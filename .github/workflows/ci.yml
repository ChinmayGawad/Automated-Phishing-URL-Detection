# PhishGuard CI/CD Pipeline

```yaml
name: PhishGuard CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e ".[dev]"
        pip install ruff mypy pytest-cov
    
    - name: Lint with ruff
      run: |
        ruff check src/ tests/
        ruff format --check src/ tests/
    
    - name: Type check with mypy
      run: |
        mypy src/ --ignore-missing-imports
    
    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=src --cov-report=xml -k "not test_vision"
      env:
        CI: "1"
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
    
    - name: Check ONNX size
      run: |
        python -c "
        from pathlib import Path
        onnx = Path('extension/models/lexical.onnx')
        if onnx.exists():
            size_mb = onnx.stat().st_size / (1024 * 1024)
            assert size_mb < 5, f'ONNX model too large: {size_mb:.1f} MB'
            print(f'ONNX size: {size_mb:.1f} MB ✓')
        else:
            print('ONNX model not found, skipping size check')
        "
    
    - name: Check generated constants
      run: |
        python scripts/gen_extension_constants.py
        python -c "
        from pathlib import Path
        for f in ['_gen_feature_names.js', '_gen_known_brands.js', '_gen_known_legit.js', '_gen_thresholds.js']:
            assert (Path('extension/lib') / f).exists(), f'Missing generated file: {f}'
        print('All generated constants present ✓')
        "

  build-extension:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install skl2onnx onnx onnxruntime
    
    - name: Build ONNX model
      run: |
        python build/export_model.py --onnx-trees 50
    
    - name: Verify extension
      run: |
        python -c "
        from pathlib import Path
        wasm_files = list(Path('extension/lib').glob('*.wasm'))
        print(f'Found {len(wasm_files)} WASM files: {[f.name for f in wasm_files]}')
        
        onnx = Path('extension/models/lexical.onnx')
        print(f'ONNX model size: {onnx.stat().st_size / 1024 / 1024:.1f} MB')
        
        # Check manifest
        import json
        manifest = json.loads((Path('extension/manifest.json')).read_text())
        print(f'Extension version: {manifest[\"version\"]}')
        "
    
    - name: Upload extension artifact
      uses: actions/upload-artifact@v4
      with:
        name: phishguard-extension
        path: extension/
        retention-days: 7
```
